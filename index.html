<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Works</title>
    <!-- 링크 미리보기 봇이 읽는 고정 글자라 보는 사람 언어를 알 수 없음: 한국어·English 를 같이 적음 -->
    <meta name="description" content="LLM과 함께 만들어 배포한 작업물 모음 · Works made and deployed with LLMs" />
    <meta property="og:title" content="LLM Works" />
    <meta property="og:description" content="LLM과 함께 만들어 배포한 작업물 모음 · Works made and deployed with LLMs" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // 시스템(브라우저) 언어 목록에서 처음 만나는 ko / en 을 <html lang> 에 적음. 둘 다 없으면 en
      // 첫 화면이 그려지기 전에 정해서 글자가 바뀌며 깜빡이지 않게 함 (src/main.js 와 style.css 가 이 값을 따름)
      (() => {
        const langs = navigator.languages?.length ? navigator.languages : [navigator.language];
        const found = langs.map((code) => /^(ko|en)\b/i.exec(code)).find(Boolean);
        document.documentElement.lang = found ? found[1].toLowerCase() : 'en';
      })();
    </script>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <h1>LLM Works</h1>
        <p class="tagline"><span id="count" class="count" aria-hidden="true"></span> <span lang="ko">LLM과 함께 만들어 배포한 것들</span><span lang="en">Things made and deployed with LLMs</span></p>
      </header>

      <main>
        <ul id="grid" class="grid"></ul>
      </main>

      <footer class="footer">
        <a href="https://github.com/tomlim2">github.com/tomlim2</a>
      </footer>
    </div>

    <template id="card-template">
      <li class="item">
        <a class="card" target="_blank" rel="noopener">
          <div class="meta"><span class="num"></span><span class="version"></span></div>
          <div class="thumb"><img alt="" loading="lazy" decoding="async" width="1280" height="800" /></div>
          <div class="info">
            <h2 class="title"></h2>
            <span class="url"></span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17 17 7M8 7h9v9" />
            </svg>
          </div>
        </a>
      </li>
    </template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
